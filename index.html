<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var path = location.pathname
        if (!path.endsWith("/") && history.replaceState) {
          var segs = path.split("/").filter(Boolean)
          var last = segs[segs.length - 1] || ""
          if (last.indexOf(".") === -1) {
            history.replaceState(
              null,
              "",
              path + "/" + location.search + location.hash,
            )
          }
        }
      })()
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1B1C21" />
    <meta name="description" content="" />
    <title></title>
    <link
      rel="stylesheet"
      href="./vendor/highlight-github-dark.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%2319AF2A'/><path d='M22 32l8 8 14-16' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/></svg>"
    />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1 class="hero__title" data-i18n="heroTitle"></h1>
      </header>

      <section class="card guide" aria-labelledby="guide-title">
        <h2 class="section-title" id="guide-title" data-i18n="guideTitle"></h2>
        <ol class="guide__list">
          <li data-i18n="guideP1"></li>
          <li data-i18n="guideP2"></li>
          <li data-i18n="guideP3"></li>
          <li data-i18n="guideP4"></li>
        </ol>
        <p class="guide__more muted small">
          <a
            class="guide__anchor"
            id="guide-deep-dive-link"
            href="#deep-dive"
            data-i18n="guideDeepDiveLink"
          ></a>
          <br />
          <a class="guide__anchor" id="guide-faq-link" href="#faq" data-i18n="guideFaqLink"></a>
        </p>
      </section>

      <section class="summary">
        <div class="summary__row">
          <div class="card summary__cell">
            <span class="muted small" data-i18n="gameLabel"></span>
            <span class="big" id="summary-game">—</span>
          </div>
          <div class="card summary__cell">
            <span class="muted small" data-i18n="dateLabel"></span>
            <span class="big" id="summary-date">—</span>
          </div>
        </div>
        <div class="summary__row">
          <div class="card summary__cell">
            <span class="muted small" data-i18n="roomLabel"></span>
            <span class="big" id="summary-room">—</span>
          </div>
          <div class="card summary__cell">
            <span class="muted small" data-i18n="rouletteLabel"></span>
            <span class="big" id="summary-position">—</span>
          </div>
        </div>
        <div class="card summary__winner">
          <span class="muted small" data-i18n="winnerLabel"></span>
          <div class="winner" id="summary-winner">—</div>
        </div>

        <button
          type="button"
          class="card kv"
          data-copy-target="input-commit"
          data-i18n-title="copyHashTitle"
        >
          <span class="kv__key"><span data-i18n="hash"></span>:</span>
          <span class="kv__value mono" id="kv-commit">—</span>
          <span class="kv__icon" aria-hidden="true">⧉</span>
        </button>
        <button
          type="button"
          class="card kv"
          data-copy-target="input-salt-hash"
          data-i18n-title="copySaltHashTitle"
        >
          <span class="kv__key"><span data-i18n="saltHashShort"></span>:</span>
          <span class="kv__value mono" id="kv-salt-hash">—</span>
          <span class="kv__icon" aria-hidden="true">⧉</span>
        </button>
        <button
          type="button"
          class="card kv"
          data-copy-target="input-salt"
          data-i18n-title="copySeedTitle"
        >
          <span class="kv__key"><span data-i18n="seedLabel"></span>:</span>
          <span class="kv__value mono" id="kv-salt">—</span>
          <span class="kv__icon" aria-hidden="true">⧉</span>
        </button>
      </section>

      <section class="card card--block">
        <h2 class="section-title" data-i18n="participantsTitle"></h2>
        <div id="participants-list" class="participants">
          <div class="empty" data-i18n="participantsEmpty"></div>
        </div>
      </section>

      <section class="card card--block">
        <h2 class="section-title" data-i18n="fieldsTitle"></h2>
        <p class="muted small section-hint" data-i18n="fieldsHint"></p>

        <label class="field field--preimage">
          <div class="field__label-row">
            <span class="field__label" data-i18n="preimageLabel"></span>
            <button
              type="button"
              class="btn btn--ghost field__copy-btn"
              data-copy-target="input-preimage"
              data-i18n="copyPreimage"
              data-i18n-title="copyPreimageTitle"
            ></button>
          </div>
          <textarea
            id="input-preimage"
            class="field__input mono"
            rows="1"
            spellcheck="false"
            autocomplete="off"
            data-i18n-placeholder="preimagePlaceholder"
          ></textarea>
          <span class="field__note" id="note-preimage"></span>
        </label>

        <label class="field">
          <span class="field__label" data-i18n="saltHashLabel"></span>
          <input
            id="input-salt-hash"
            class="field__input mono"
            type="text"
            spellcheck="false"
            autocomplete="off"
          />
          <span class="field__note" id="note-salt-hash"></span>
        </label>

        <label class="field">
          <span class="field__label" data-i18n="saltLabel"></span>
          <input
            id="input-salt"
            class="field__input mono"
            type="text"
            spellcheck="false"
            autocomplete="off"
          />
          <span class="field__note" id="note-salt"></span>
        </label>

        <label class="field">
          <span class="field__label" data-i18n="commitLabel"></span>
          <input
            id="input-commit"
            class="field__input mono"
            type="text"
            spellcheck="false"
            autocomplete="off"
          />
          <span class="field__note" id="note-commit"></span>
        </label>

        <label class="field">
          <span class="field__label" data-i18n="clientCommitLabel"></span>
          <input
            id="input-client-commit"
            class="field__input mono"
            type="text"
            spellcheck="false"
            autocomplete="off"
          />
          <span class="field__note" id="note-client-commit"></span>
        </label>

        <label class="field">
          <span class="field__label" data-i18n="positionLabel"></span>
          <input
            id="input-position"
            class="field__input mono"
            type="text"
            inputmode="numeric"
            spellcheck="false"
            autocomplete="off"
          />
          <span class="field__note" id="note-position"></span>
        </label>
      </section>

      <section class="result-panel card" id="result-panel" hidden>
        <p class="result-panel__ok" id="result-success"></p>
        <p class="result-panel__fail" id="result-fail"></p>

        <div class="computed" id="computed-block" hidden>
          <h3 class="section-title" data-i18n="computedTitle"></h3>
          <dl class="computed__list">
            <div class="computed__row" id="computed-row-salt-hash" hidden>
              <dt class="muted small" data-i18n="computedSaltHash"></dt>
              <dd class="mono break" id="computed-salt-hash">—</dd>
            </div>
            <div class="computed__row">
              <dt class="muted small" data-i18n="computedCommit"></dt>
              <dd class="mono break" id="computed-commit">—</dd>
            </div>
            <div class="computed__row">
              <dt class="muted small" data-i18n="computedMask"></dt>
              <dd class="mono break" id="computed-mask">—</dd>
            </div>
            <div class="computed__row">
              <dt class="muted small" data-i18n="computedPosition"></dt>
              <dd class="mono" id="computed-position">—</dd>
            </div>
          </dl>
        </div>
      </section>

      <div class="sticky-cta">
        <button type="button" class="btn btn--primary" id="btn-check">
          <span id="btn-check-label" data-i18n="checkAction"></span>
        </button>
      </div>

      <section class="card card--block">
        <h2 class="section-title" data-i18n="scriptTitle"></h2>
        <p class="muted small section-hint" data-i18n="scriptHint"></p>
        <div class="script-repo-cta">
          <a
            class="btn btn--github"
            href="https://github.com/trix-public/legit-check"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span data-i18n="repositoryBtn"></span>
          </a>
        </div>
        <pre class="code"><code id="script-source"></code></pre>
      </section>

      <div id="deep-dive" class="deep-dive">
        <section class="card theory" aria-labelledby="theory-title">
          <h2 class="section-title" id="theory-title" data-i18n="algorithmTitle"></h2>
          <p class="muted small theory__p" data-i18n="algorithmLead"></p>
          <p class="muted small theory__p" data-i18n="algorithmP1"></p>
          <p class="muted small theory__p" data-i18n="algorithmP2"></p>
          <p class="muted small theory__p" data-i18n="algorithmSaltHash"></p>
          <ol class="theory__list">
            <li data-i18n="algorithmStep0"></li>
            <li data-i18n="algorithmStep1"></li>
            <li data-i18n="algorithmStep2"></li>
            <li data-i18n="algorithmStep3"></li>
            <li data-i18n="algorithmStep4"></li>
          </ol>
          <p class="muted small theory__p theory__p--last" data-i18n="algorithmSummary"></p>
        </section>

        <section class="card trust" aria-labelledby="trust-title">
          <h2 class="section-title" id="trust-title" data-i18n="trustTitle"></h2>
          <p class="muted small theory__p" data-i18n="trustP1"></p>
          <p class="muted small theory__p" data-i18n="trustP2"></p>
          <p class="muted small theory__p" data-i18n="trustP3"></p>
          <p class="muted small theory__p theory__p--last" data-i18n="trustP4"></p>
        </section>

        <section class="card faq" id="faq" aria-labelledby="faq-title">
          <h2 class="section-title" id="faq-title" data-i18n="faqTitle"></h2>
          <p class="muted small theory__p theory__p--last" data-i18n="faqLead"></p>
          <div class="faq__list">
            <details class="faq__item">
              <summary class="faq__q" data-i18n="faqQ_json"></summary>
              <p class="faq__a muted small" data-i18n="faqA_json"></p>
            </details>
            <details class="faq__item">
              <summary class="faq__q" data-i18n="faqQ_salt"></summary>
              <p class="faq__a muted small" data-i18n="faqA_salt"></p>
            </details>
            <details class="faq__item">
              <summary class="faq__q" data-i18n="faqQ_salt_hash"></summary>
              <p class="faq__a muted small" data-i18n="faqA_salt_hash"></p>
            </details>
            <details class="faq__item">
              <summary class="faq__q" data-i18n="faqQ_salt_proof"></summary>
              <p class="faq__a muted small" data-i18n="faqA_salt_proof"></p>
            </details>
            <details class="faq__item">
              <summary class="faq__q" data-i18n="faqQ_commit"></summary>
              <p class="faq__a muted small" data-i18n="faqA_commit"></p>
            </details>
            <details class="faq__item">
              <summary class="faq__q" data-i18n="faqQ_client_commit"></summary>
              <p class="faq__a muted small" data-i18n="faqA_client_commit"></p>
            </details>
            <details class="faq__item">
              <summary class="faq__q" data-i18n="faqQ_position"></summary>
              <p class="faq__a muted small" data-i18n="faqA_position"></p>
            </details>
            <details class="faq__item">
              <summary class="faq__q" data-i18n="faqQ_hash"></summary>
              <p class="faq__a muted small" data-i18n="faqA_hash"></p>
            </details>
            <details class="faq__item">
              <summary class="faq__q" data-i18n="faqQ_base64"></summary>
              <p class="faq__a muted small" data-i18n="faqA_base64"></p>
            </details>
            <details class="faq__item">
              <summary class="faq__q" data-i18n="faqQ_utf8"></summary>
              <p class="faq__a muted small" data-i18n="faqA_utf8"></p>
            </details>
            <details class="faq__item">
              <summary class="faq__q" data-i18n="faqQ_commit_reveal"></summary>
              <p class="faq__a muted small" data-i18n="faqA_commit_reveal"></p>
            </details>
            <details class="faq__item">
              <summary class="faq__q" data-i18n="faqQ_chain"></summary>
              <div class="faq__a">
                <p class="muted small faq__a-lead" data-i18n="faqA_chain_lead"></p>
                <ol class="faq__steps muted small">
                  <li data-i18n="faqA_chain_1"></li>
                  <li data-i18n="faqA_chain_2"></li>
                  <li data-i18n="faqA_chain_3"></li>
                  <li data-i18n="faqA_chain_4"></li>
                  <li data-i18n="faqA_chain_5"></li>
                </ol>
                <p class="muted small faq__a-foot" data-i18n="faqA_chain_foot"></p>
              </div>
            </details>
          </div>
        </section>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./scripts/app.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const sync = () => {
          const hash = document.getElementById("input-commit").value.trim()
          const seedHash = document.getElementById("input-salt-hash").value.trim()
          const seed = document.getElementById("input-salt").value.trim()
          document.getElementById("kv-commit").textContent = hash || "—"
          document.getElementById("kv-salt-hash").textContent = seedHash || "—"
          document.getElementById("kv-salt").textContent = seed || "—"
        }
        for (const id of ["input-commit", "input-salt-hash", "input-salt"]) {
          const el = document.getElementById(id)
          if (el) el.addEventListener("input", sync)
        }
        setTimeout(sync, 100)
        setTimeout(sync, 500)
      })
    </script>
  </body>
</html>
